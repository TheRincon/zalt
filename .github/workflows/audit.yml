name: audit

# cargo-deny on a timer. The `deny` job in ci.yml runs only when something is
# pushed, and advisories arrive without a push: 0.1.0's release check found
# four against zstd-rs that had landed while the code sat unchanged.
#
# GitHub runs scheduled workflows from the default branch only, and pauses
# them after 60 days without activity in the repository.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - run: just deny
