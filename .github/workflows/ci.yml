name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Use the `ci` nextest profile: no fail-fast, no retries, junit output.
  NEXTEST_PROFILE: ci

jobs:
  # The primary target. Apple Silicon runners exercise the NEON kernels and the
  # equivalence tests that make the backend seam trustworthy.
  apple-silicon:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest
      # The conformance tests read derived fixtures, and deriving them needs the
      # reference binary. Guarded because the runner image usually ships it.
      - name: ensure zstd
        run: command -v zstd || brew install zstd
      # One command, and it is the same one run locally before pushing. CI and
      # the developer loop cannot drift apart if they share the recipe.
      - run: just gate
      - name: kernel benchmarks (smoke)
        run: just bench

  # zalt-codec claims to be a general zstd crate. This job is what makes that
  # claim true rather than aspirational: if it only ever built on aarch64, the
  # portability story would rot silently.
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest
      - name: ensure zstd
        run: command -v zstd || (sudo apt-get update && sudo apt-get install -y zstd)
      - run: just fast-test
      - run: just no-std

  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just layering

  # What may enter the dependency tree, from deny.toml: permissive licenses
  # only, no known security advisories, crates.io only. Its own job because the
  # advisory database changes without any commit here, and a new advisory
  # should be visible on its own rather than mixed into a test failure.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - run: just deny

  # Fuzz targets are dev-only, so nothing else builds them. Without this they
  # rot silently: a target referencing a renamed API compiles nowhere and nobody
  # notices until someone tries to fuzz.
  fuzz-build:
    runs-on: macos-14
    # `-D warnings` is deliberately not inherited here. It is right for the
    # stable jobs, whose toolchain `rust-toolchain.toml` pins and whose warning
    # set is therefore reproducible. This job floats on the latest nightly, so
    # denying warnings makes any newly-landed lint fail a build that is only
    # asking "do the fuzz targets still compile" — a red CI caused by a calendar
    # rather than by a commit.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-fuzz
      - run: just fuzz-build

  # Miri is not run here. It ran over the scalar path until 2026-10, when the
  # encoder's tests had grown it from about four minutes to over six hours a
  # run. It is still the only UB detection this code gets — NEON intrinsics
  # are beyond it, which is why the scalar backend is never deleted — so it is
  # run locally when a change warrants it: `just miri`, or `just pre-push-full`.
