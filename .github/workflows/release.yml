name: release

# Pushing a version tag builds `zalt` for each target and attaches the
# tarballs and checksums to that tag's GitHub release. When the release does
# not exist yet it is created as a *draft*, so a person writes the notes and
# publishes it. crates.io stays manual (`cargo publish`), by choice.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-26 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # A tag that disagrees with the version would publish binaries that
      # report a different version from the release they are attached to.
      - name: tag matches the crate version
        run: |
          v=$(cargo pkgid -p zalt | sed 's/.*[#@]//')
          [ "v$v" = "$TAG" ] || { echo "tag $TAG, but zalt is $v"; exit 1; }
      - run: just dist ${{ matrix.target }}
      - name: smoke test
        run: |
          bin=target/${{ matrix.target }}/release/zalt
          "$bin" --version
          echo hello | "$bin" c | "$bin" d | grep -qx hello
      - uses: actions/upload-artifact@v4
        with:
          name: zalt-${{ matrix.target }}
          path: target/dist/*.tar.gz*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag \
              --title "zalt ${TAG#v}" --generate-notes
          fi
