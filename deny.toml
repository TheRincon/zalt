# cargo-deny: what may enter the dependency tree. `just deny` runs it; so does
# CI.
#
# zalt is released as Unlicense OR MIT OR Apache-2.0, so everything it pulls in
# must allow the same freedom: permissive licenses only. A copyleft crate would
# make a binary built from zalt carry obligations zalt itself waives. This list
# is what the tree uses today, not every license that would be acceptable;
# widening it is a decision, and should be one.

[graph]
# Every feature, so `native-fs` (cap-std, rustix, exacl, nix) is checked even
# though it is off by default; and every target, so the Windows and Linux arms
# of those crates are too.
all-features = true

[licenses]
version = 2
confidence-threshold = 0.95
# The libfuzzer-sys exception below is used only when checking `fuzz/`.
unused-license-exception = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # zstd and zstd-sys, used as the oracle by tests, the bench and the probe;
    # and zstd's vendored C in zlta-seekable-probe.
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "Unlicense",
]
exceptions = [
    # libFuzzer is LLVM's, under the permissive NCSA license. It is linked only
    # into the fuzz targets (`fuzz/`, which shares this file), never into zalt.
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[bans]
# Two versions of one crate is two copies to build and review. Warn rather than
# deny: today's duplicates (windows-sys, getrandom, cpufeatures, io-lifetimes)
# all come from upstream crates disagreeing, which zalt cannot fix alone.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path dependencies carry versions; a private crate's
# path-only dev-dependency is not a wildcard anyone can resolve against.
allow-wildcard-paths = true

[sources]
# crates.io only. A git dependency is code no registry has a record of.
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
version = 2
yanked = "deny"
