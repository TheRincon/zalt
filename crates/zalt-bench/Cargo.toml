[package]
name = "zalt-bench"
description = "Baseline and kernel benchmarks for zalt. Corpus-directory driven, no built-in content opinion."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
zalt-codec.workspace = true
zalt-embed.workspace = true
# An independent pure-Rust decoder, measured alongside zalt in the same run.
#
# The reference answers "how far from the C implementation are we". This
# answers a question the reference cannot: how far from *another Rust decoder*,
# measured on the same corpus, in the same window, on the same machine. A gap
# against libzstd that is mostly the cost of being written in safe Rust looks
# very different from one that is not, and only a second Rust implementation
# distinguishes them.
ruzstd = "0.7"
# libzstd, in process, for the *encode* comparison only.
#
# The decode mode times the reference through its CLI and says in its own
# comment that the number is not comparable at small sizes. For encode that
# would not be a caveat but a defect: §8's workload is many small resources,
# where a fork and two pipes are most of the measurement. In-process is also
# what makes the comparison *interleavable* — zalt and libzstd alternate
# batches inside one loop, so a thermal step or a core migration lands on both
# rather than on whichever happened to run second, which is the failure the
# machine in §10 produces constantly.
#
# `default-features = false` drops the legacy decoder and the dictionary
# trainer; neither is compressed here and both are build time.
zstd = { version = "0.14", default-features = false }

[target.'cfg(target_arch = "aarch64")'.dependencies]
zalt-neon.workspace = true
