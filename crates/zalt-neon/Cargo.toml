[package]
name = "zalt-neon"
description = "aarch64 NEON kernels implementing the zalt-codec backend seam."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["zstd", "neon", "simd", "aarch64", "compression"]
categories = ["compression", "hardware-support"]

[dependencies]
zalt-codec.workspace = true

# Every kernel is `cfg(target_arch = "aarch64")`; docs.rs's default x86_64
# build would document none of them.
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu"]
