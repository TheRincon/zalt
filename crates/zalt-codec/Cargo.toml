[package]
name = "zalt-codec"
description = "Zstandard (RFC 8878) codec core. Modern frames only, no_std, no legacy formats."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Four encoder modules are derived in part from libzstd and stay under its BSD
# license (`LICENSE-ZSTD`); see the headers in `src/encode/`.
license = "(Unlicense OR MIT OR Apache-2.0) AND BSD-3-Clause"
repository.workspace = true
readme.workspace = true
keywords = ["zstd", "zstandard", "compression", "decompression", "rfc8878"]
categories = ["compression", "no-std"]

[dependencies]

[dev-dependencies]
# Property tests. `proptest` checks stated invariants on every `just t`, where
# the fuzz targets check them for hours on demand — different cadence, same
# properties, and these are the ones written down in the repo.
proptest = "1"
# An independent third-party zstd decoder, used as a *second* oracle.
#
# libzstd has been the only reference, so a shared misreading of RFC 8878 would
# be invisible to every test here. An implementation written separately from
# both is the cheapest defence against that, and disagreement is a strong signal
# precisely because nothing is shared but the spec.
ruzstd = "0.9.1"

[features]
default = []
