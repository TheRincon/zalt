[package]
name = "zalt-cli"
description = "zalt(1): compress, decompress and inspect zstd frames, and create and extract ZALT-archives, from the shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "zalt"
path = "src/main.rs"

[dependencies]
zalt-codec.workspace = true
zalt-embed.workspace = true
# `native-fs`: archiving and extracting real files, with their macOS metadata.
zalt-archive = { workspace = true, features = ["native-fs"] }
