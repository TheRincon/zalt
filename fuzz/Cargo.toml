[package]
name = "zalt-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace: fuzz targets build with different flags (sanitizers,
# coverage instrumentation) and must not perturb the main workspace's lockfile
# or profiles.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zalt-codec = { path = "../crates/zalt-codec" }
zalt-neon = { path = "../crates/zalt-neon" }

# The oracle. A C dependency, which is acceptable in a dev-only crate and would
# not be anywhere else — the layering forbids it below L3. `zstd-sys` here
# tracks libzstd 1.5.7, matching the CLI that generates the fixtures.
zstd = "0.13"

[profile.release]
debug = true
# Overflow is a bug worth finding, not a wrap to tolerate.
overflow-checks = true

[[bin]]
name = "decode_hostile"
path = "fuzz_targets/decode_hostile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_differential"
path = "fuzz_targets/decode_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip_valid"
path = "fuzz_targets/roundtrip_valid.rs"
test = false
doc = false
bench = false

[[bin]]
name = "streaming_equivalence"
path = "fuzz_targets/streaming_equivalence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "backend_equivalence"
path = "fuzz_targets/backend_equivalence.rs"
test = false
doc = false
bench = false
