[package]
name = "zalt-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Unlicense OR MIT OR Apache-2.0"

# Its own workspace: fuzz targets build with different flags (sanitizers,
# coverage instrumentation) and must not perturb the main workspace's lockfile
# or profiles.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zalt-codec = { path = "../crates/zalt-codec" }
zalt-neon = { path = "../crates/zalt-neon" }
# The dcz header is untrusted wire input; its parser is fuzzed like any other.
zalt-recipe = { path = "../crates/zalt-recipe", default-features = false, features = ["parse"] }
# ZALT-archives: the trailer, the Central Index and VarInt are untrusted input
# (spec §13, §14.3).
zalt-archive = { path = "../crates/zalt-archive" }
# The reference XXH3-128 (xxHash's own C), for `archive_hash`. Test-only, as
# everywhere it appears.
zlta-seekable-probe = { path = "../crates/zlta-seekable-probe" }
# BLAKE3's own one-shot digest, the oracle for the parallel hasher in
# `archive_hash`. Already in the tree, as zalt-archive's.
blake3 = { version = "1.8", default-features = false, features = ["std", "pure"] }

# The oracle. A C dependency, which is acceptable in a dev-only crate and would
# not be anywhere else — the layering forbids it below L3. `zstd-sys` here
# tracks libzstd 1.5.7, matching the CLI that generates the fixtures.
zstd = "0.13"

[profile.release]
debug = true
# Overflow is a bug worth finding, not a wrap to tolerate.
overflow-checks = true

[[bin]]
name = "decode_hostile"
path = "fuzz_targets/decode_hostile.rs"
test = false
doc = false
bench = false

